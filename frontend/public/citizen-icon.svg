<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="citizenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0a1811"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#citizenBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Protective Ecological Shield -->
  <path d="M 130 130 Q 256 80 382 130 Q 400 290 256 410 Q 112 290 130 130 Z" fill="#042f2e" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#cblur)"/>

  <!-- Vibrant Emerald Tree Canopy & Leaf -->
  <path d="M 256 370 C 170 360, 170 260, 256 160 C 342 260, 342 360, 256 370 Z" fill="url(#leafGrad)" stroke="#6ee7b7" stroke-width="6"/>

  <!-- Leaf Stem & Branches -->
  <path d="M 256 370 L 256 165" fill="none" stroke="#022c22" stroke-width="8" stroke-linecap="round"/>
  <path d="M 256 300 Q 215 270 195 235" fill="none" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 300 Q 297 270 317 235" fill="none" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 240 Q 225 220 205 195" fill="none" stroke="#022c22" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 240 Q 287 220 307 195" fill="none" stroke="#022c22" stroke-width="5" stroke-linecap="round"/>

  <!-- Subtitle Tag: CITIZEN -->
  <rect x="146" y="426" width="220" height="42" rx="21" fill="#065f46" stroke="#a7f3d0" stroke-width="2"/>
  <text x="256" y="453" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">CITIZEN</text>
</svg>
