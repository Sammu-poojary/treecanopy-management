<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cutterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background Badge -->
  <rect width="512" height="512" rx="110" fill="url(#cutterBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Outer Tree Canopy Backdrop -->
  <path d="M 256 95 C 190 95, 140 145, 155 210 C 120 230, 115 285, 145 320 C 135 345, 145 375, 175 385 C 195 410, 240 415, 256 415 C 272 415, 317 410, 337 385 C 367 375, 377 345, 367 320 C 397 285, 392 230, 357 210 C 372 145, 322 95, 256 95 Z" fill="#042f2e" stroke="#14b8a6" stroke-width="8" stroke-linejoin="round" opacity="0.85"/>

  <!-- Left Axe -->
  <g transform="rotate(45 256 260)" filter="url(#glow)">
    <!-- Axe Handle -->
    <rect x="246" y="110" width="20" height="300" rx="10" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2"/>
    <!-- Grip Wraps -->
    <line x1="246" y1="330" x2="266" y2="340" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <line x1="246" y1="350" x2="266" y2="360" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <line x1="246" y1="370" x2="266" y2="380" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <!-- Axe Head -->
    <path d="M 246 130 C 230 115, 170 120, 160 170 C 170 215, 230 220, 246 205 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="4"/>
    <!-- Sharp Cutting Edge -->
    <path d="M 160 170 Q 150 140 170 125" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Right Axe -->
  <g transform="rotate(-45 256 260)" filter="url(#glow)">
    <!-- Axe Handle -->
    <rect x="246" y="110" width="20" height="300" rx="10" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2"/>
    <!-- Grip Wraps -->
    <line x1="246" y1="330" x2="266" y2="340" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <line x1="246" y1="350" x2="266" y2="360" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <line x1="246" y1="370" x2="266" y2="380" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
    <!-- Axe Head -->
    <path d="M 266 130 C 282 115, 342 120, 352 170 C 342 215, 282 220, 266 205 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="4"/>
    <!-- Sharp Cutting Edge -->
    <path d="M 352 170 Q 362 140 342 125" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Central Arborist Shield / Badge -->
  <circle cx="256" cy="260" r="42" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
  <!-- Leaf inside central emblem -->
  <path d="M 256 230 C 240 245, 240 265, 256 285 C 272 265, 272 245, 256 230 Z" fill="url(#goldGrad)"/>
  <line x1="256" y1="235" x2="256" y2="285" stroke="#78350f" stroke-width="2.5"/>

  <!-- Subtitle Tag: CUTTER OPS -->
  <rect x="146" y="420" width="220" height="42" rx="21" fill="#b45309" stroke="#fef3c7" stroke-width="2"/>
  <text x="256" y="447" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">CUTTER OPS</text>
</svg>
